# Ambiente local completo: Postgres com os DOIS papéis (plataforma com BYPASSRLS, tenant comum) + API.
#   docker compose up -d db
#   docker compose run --rm api sh -c "npm run prisma:deploy && npm run db:rls && npm run db:seed"
#   docker compose up api web      →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fc_platform
      POSTGRES_PASSWORD: fc_platform_dev
      POSTGRES_DB: fullcomercy
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc_platform -d fullcomercy"]
      interval: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: development
      PORT: 3000
      # papel do TENANT (sujeito ao RLS) e papel da PLATAFORMA (BYPASSRLS) — criados em docker/initdb
      DATABASE_URL: postgresql://app_rw:app_rw_dev@db:5432/fullcomercy?schema=public
      DATABASE_ADMIN_URL: postgresql://fc_platform:fc_platform_dev@db:5432/fullcomercy?schema=public
      JWT_SECRET: dev-only-change-me-0123456789abcdef0123456789
      PLATFORM_API_KEY: dev-only-platform-key-0123456789abcdef
      APP_ENCRYPTION_KEY: dev-only-encryption-key-0123456789
      SEED_ADMIN_PASSWORD: Demo-12345678
    ports: ["3000:3000"]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  pgdata:
