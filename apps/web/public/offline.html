<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4348c4" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <title>Sem conexão · ERP Modular</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f3; --card: #fff; --ink: #18181b; --muted: #6b6b70; --brand: #4348c4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #08090b; --card: #141519; --ink: #f4f4f5; --muted: #a1a1aa; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(420px, 100%); background: var(--card); border-radius: 18px; padding: 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    a { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sem conexão</h1>
    <p>O sistema precisa de internet para mostrar e salvar os dados da sua empresa. Confira a conexão e tente de novo.</p>
    <a href="/">Tentar de novo</a>
  </main>
</body>
</html>
